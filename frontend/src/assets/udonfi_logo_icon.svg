<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 38" width="42" height="38" fill="none">
  <defs>
    <!-- Cyan to Purple Gradient for the Bowl -->
    <linearGradient id="bowlGrad" x1="4" y1="18" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>
  </defs>

  <!-- Steam Lines -->
  <rect x="12" y="6" width="2" height="10" rx="1" fill="#00f2fe" opacity="0.8" />
  <rect x="20" y="6" width="2" height="10" rx="1" fill="#00f2fe" opacity="0.8" />
  <rect x="28" y="6" width="2" height="10" rx="1" fill="#00f2fe" opacity="0.8" />

  <!-- Bowl Outer Border and Fill -->
  <path d="M 5 19 L 37 19 A 16 16 0 0 1 5 19 Z" fill="url(#bowlGrad)" stroke="#f1f5f9" stroke-width="2" stroke-linejoin="round" />

  <!-- Bowl Inner Line (clipped to bowl fill) -->
  <clipPath id="bowlClip">
    <path d="M 5 19 L 37 19 A 16 16 0 0 1 5 19 Z" />
  </clipPath>
  <rect x="4" y="22" width="34" height="2" fill="#f1f5f9" clip-path="url(#bowlClip)" />

  <!-- Chopsticks -->
  <rect x="0" y="14" width="38" height="2" rx="1" fill="#f1f5f9" transform="rotate(-15 19 15)" />
  <rect x="2" y="10" width="38" height="2" rx="1" fill="#f1f5f9" transform="rotate(-20 21 11)" />
</svg>
