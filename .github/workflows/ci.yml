name: UdonFi CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  smart-contracts:
    name: Smart Contracts CI (Soroban Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Cargo Check
        run: |
          cd contracts
          cargo check --workspace

      - name: Cargo Test
        run: |
          cd contracts
          cargo test --workspace

      - name: Cargo Build WASM
        run: |
          cd contracts
          cargo build --target wasm32v1-none --release --workspace

      - name: Cargo Clippy Lint
        run: |
          cd contracts
          cargo clippy --all-targets -- -D warnings

      - name: Cargo Format Check
        run: |
          cd contracts
          cargo fmt --all -- --check

  frontend:
    name: Frontend CI (React TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Type Check & Vite Build
        run: |
          cd frontend
          npm run build
