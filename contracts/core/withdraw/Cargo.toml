[package]
name = "udonfi-withdraw"
version = "0.1.0"
edition = "2021"

[lib]
path = "mod.rs"
crate-type = ["lib"]

[dependencies]
soroban-sdk = "25.0.1"
udonfi-accounting = { path = "../accounting" }
udonfi-config-engine = { path = "../config" }
udonfi-interest = { path = "../interest" }
udonfi-pool-state = { path = "../pool" }
udonfi-reserve-registry = { path = "../reserve" }
udonfi-risk = { path = "../risk" }
udonfi-shared = { path = "../../shared" }

[dev-dependencies]
soroban-sdk = { version = "25.0.1", features = ["testutils"] }

